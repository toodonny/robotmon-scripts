      #top-bar{

      /* Button CSS */

      .centered {
      margin:50px auto;
      text-align:center;
      }

      .button::-moz-focus-inner{
      border: 0;
      padding: 0;
      }

      .button{
      display: inline-block;
      /* display: inline; */
      zoom: 1;
      padding: 6px 20px;
      margin: 0;
      cursor: pointer;
      border: 1px solid #bbb;
      overflow: visible;
      font: bold 13px arial, helvetica, sans-serif;
      text-decoration: none;
      white-space: nowrap;
      color: #555;

      background-color: #ddd;
      background-image: -webkit-gradient(linear, left top, left bottom, from(rgba(255,255,255,1)), to(rgba(255,255,255,0)));
      background-image: -webkit-linear-gradient(top, rgba(255,255,255,1), rgba(255,255,255,0));
      background-image: -moz-linear-gradient(top, rgba(255,255,255,1), rgba(255,255,255,0));
      background-image: -ms-linear-gradient(top, rgba(255,255,255,1), rgba(255,255,255,0));
      background-image: -o-linear-gradient(top, rgba(255,255,255,1), rgba(255,255,255,0));
      background-image: linear-gradient(top, rgba(255,255,255,1), rgba(255,255,255,0));

      -webkit-transition: background-color .2s ease-out;
      -moz-transition: background-color .2s ease-out;
      -ms-transition: background-color .2s ease-out;
      -o-transition: background-color .2s ease-out;
      transition: background-color .2s ease-out;
      background-clip: padding-box; /* Fix bleeding */
      -moz-border-radius: 3px;
      -webkit-border-radius: 3px;
      border-radius: 3px;
      -moz-box-shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 2px 2px -1px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .3) inset;
      -webkit-box-shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 2px 2px -1px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .3) inset;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 2px 2px -1px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .3) inset;
      text-shadow: 0 1px 0 rgba(255,255,255, .9);

      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      }

      .button:hover{
      background-color: #eee;
      color: #555;
      }

      .button:active{
      background: #e9e9e9;
      position: relative;
      top: 1px;
      text-shadow: none;
      -moz-box-shadow: 0 1px 1px rgba(0, 0, 0, .3) inset;
      -webkit-box-shadow: 0 1px 1px rgba(0, 0, 0, .3) inset;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .3) inset;
      }

      .button[disabled], .button[disabled]:hover, .button[disabled]:active{
      border-color: #eaeaea;
      background: #fafafa;
      cursor: default;
      position: static;
      color: #999;
      /* Usually, !important should be avoided but here it's really needed :) */
      -moz-box-shadow: none !important;
      -webkit-box-shadow: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      }

      /* Smaller buttons styles */

      .button.small{
      padding: 5px 4px;
      }

      /* Larger buttons styles */

      .button.large{
      padding: 12px 30px;
      text-transform: uppercase;
      }

      .button.large:active{
      top: 2px;
      }

      /* Colored buttons styles */

      .button.green, .button.red, .button.blue {

      /* Group buttons */

      .button-group,
      .button-group li{
      display: inline-block;
      /* display: inline; */

      }

      .button-group{
      font-size: 0; /* Inline block elements gap - fix */

      padding: 0;
      background: rgba(0, 0, 0, .1);

      .button-group li{

      .button-group .button{

      -webkit-border-radius: 0;
      border-radius: 0;
      }

      .button-group .button:active{

      -webkit-border-radius: 3px 0 0 3px;
      border-radius: 3px 0 0 3px;
      }

      }

      .list-group-item {
        padding: 6px 10px !important;
      }

      /* The switch - the box around the slider */
      .switch {
        position: relative; 
        display: inline-block;
        vertical-align: middle;
        margin: 0px;
        width: 36px;
        height: 20px;
      }

      ul {
        padding-left: 5px;
      }

      /* Hide default HTML checkbox */
      .switch input {display:none;}

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 2px;
        bottom: 4px;
        top: 2px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
      }

      input:checked + .slider {
        background-color: #2196F3;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #2196F3;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(16px);
        -ms-transform: translateX(16px);
        transform: translateX(16px);
      }

      /* Rounded sliders */
      .slider.round {
        border-radius: 16px;
      }

      .slider.round:before {
        border-radius: 50%;
      }

      .btn {
        margin-left: 5px;
      }
      .btn-plus {
        color:#FFFFFF;
        background-color: #2196F3;
        border-color: #2196F3;
      }
      .btn-plus:hover,
      .btn-plus:focus,
      .btn-plus:active,
      .btn-plus.active {
        color:#FFFFFF !important; 
        background-color: #0d8aee;
        border-color: #0c7cd5;
      }
      .btn-plus.disabled:hover,
      .btn-plus.disabled:focus,
      .btn-plus.disabled:active,
      .btn-plus.disabled.active,
      .btn-plus[disabled]:hover,
      .btn-plus[disabled]:focus,
      .btn-plus[disabled]:active,
      .btn-plus[disabled].active,
      fieldset[disabled] .btn-plus:hover,
      fieldset[disabled] .btn-plus:focus,
      fieldset[disabled] .btn-plus:active,
      fieldset[disabled] .btn-plus.active {
        color:#FFFFFF;
        background-color: #2196F3;
        border-color: #2196F3;
      }
      .btn-plus,
      .btn-danger {
        min-width: 35px;
        padding: 3px 0px 3px 0px !important;
      }
      .setting_input_value {
        width: 60px;
        text-align: right;
      }
      .setting_input_value[type=text] {
        width: 80%;
      }
      .row {
          display: flex;
          align-items: center;
      }
      #goToTop {
        position: fixed;
        bottom: 10px;
        right: 10px;
      }

    <script>
      $(function(){
        $(window).on('load', function(){
          $(window).on('scroll resize', function(){
            var $this = $(this);
            var $this_Top=$this.scrollTop();
            
            // 根據 topdistance 控制 top-bar 顯示/隱藏
            // 當滾動距離小於閾值時隱藏，等於或超過則顯示
            if (typeof topdistance === 'undefined') {
              // 若 topdistance 未定義，退回到原始行為（使用 110 作為預設）
              topdistance = 110;
            }
            // 若滾動距離小於閾值，顯示 top-bar；超過閾值則隱藏
            if ($this_Top < topdistance) {
              $('#top-bar').stop().animate({top: "0px"}, 800);
            } else {
              $('#top-bar').stop().animate({top: "-100px"}, 800);
            }
          }).scroll();
        });
      });
    </script>

      function saveLocale(locale) {
        if (hasLocalStorage()) {
          try {
            localStorage.setItem('idlerpglanguage', locale);
          } catch (e) {
            console.log('saveLocale: localStorage setItem failed', e);
          }
          location.reload();
        }
      }
	  
      function hasLocalStorage() {
        try {
          return (typeof window.localStorage !== 'undefined' && window.localStorage !== null);
        } catch (e) {
          return false;
        }
      }

      function loadSettings(settings) {
        var recordSettings = {};
        if (!hasLocalStorage()) {
          return;
        }
        var version = +localStorage.getItem('idlerpgversion');
        if (!version || VERSION != version) {
          return;
        }
        var settingsJSON = localStorage.getItem('idlerpgsettings');
        if (!settingsJSON) {
          return;
        }
        recordSettings = JSON.parse(settingsJSON);
        if (!recordSettings) {
          return;
        }
        for (var i in settings) {
          for (var g in settings[i]) {
            var id =  i + "_" + g;
            var setting = settings[i][g];
            if (recordSettings[id] != undefined) {
              setting.default = recordSettings[id];
            }
          }
        }
        console.log('Load settings');
      }
	  
      function saveSettings(settings) {
        if (hasLocalStorage()) {
          var recordSettings = {};
          for (var i in settings) {
            for (var g in settings[i]) {
              var id =  i + "_" + g;
              var setting = settings[i][g];
              if (typeof setting.default === "boolean") {
                recordSettings[id] = $("#setting_value_" + id).is(':checked');
              } else if (typeof setting.default === "number") {
                recordSettings[id] = +$("#setting_value_" + id).val();
              } else if (typeof setting.default === "string") {
                recordSettings[id] = $("#setting_value_" + id).val();
              }
            }
          }
          try {
            localStorage.setItem('idlerpgversion', VERSION);
            localStorage.setItem('idlerpgsettings', JSON.stringify(recordSettings));
          } catch (e) {
            console.log('saveSettings: localStorage setItem failed', e);
          }
          console.log('Save settings');
        }
      }
	  
      function genStartCommand(settings) {
		//var settingArray = [];
		var settingObject = {};
		var command = "start(";
        for (var i in settings) {
          for (var g in settings[i]) {
            var id =  i + "_" + g;
            var setting = settings[i][g];
            //if (settingArray[i] == undefined) {
            //	settingArray[i] = [];
            //}
			
            if (typeof setting.default === "boolean") {
              command += $("#setting_value_" + id).is(':checked') + ", ";
              //settingArray[i][g] = $("#setting_value_" + id).is(':checked');
              settingObject[setting.key] = $("#setting_value_" + id).is(':checked');
            } else if (typeof setting.default === "number") {
              command += $("#setting_value_" + id).val() + ", ";
              //settingArray[i][g] = $("#setting_value_" + id).val();
              settingObject[setting.key] = $("#setting_value_" + id).val();
            } else if (typeof setting.default === "string") {
              command += "'" + $("#setting_value_" + id).val() + "', ";
              //settingArray[i][g] = $("#setting_value_" + id).val();
              settingObject[setting.key] = $("#setting_value_" + id).val();
            }
          }
        }
        command += "undefined);"
        //console.log(settingArray, JSON.stringify(settingArray));
        //command = 'start(\'' + JSON.stringify(settingArray) + '\')';
        //console.log(settingObject, JSON.stringify(settingObject));
        // Safely escape single quotes inside JSON so it can be wrapped in single quotes
        var settingJSON = JSON.stringify(settingObject).replace(/'/g, "\\'");
        command = "start('" + settingJSON + "')";
        //console.log("Start command: " + command);
        return command;
      }

      function getTitle(setting) {
        if (!hasLocalStorage()) {
          return setting.title;
        }
        var lang = null;
        try {
          lang = localStorage.getItem('idlerpglanguage');
        } catch (e) {
          console.log('getTitle: localStorage.getItem failed', e);
        }
        if (!lang) {
          return setting.title;
        } else if (lang === "zh-TW") {
          return setting.title_zh_TW;
        }
        return setting.title;
      }

      function appendTitle(jSetting, title) {
        jSetting.append("<div class='col-xs-6'>" + title + "</div>");
      }

      function appendCol(jSetting, jContent) {
        var jDiv = $('<div class="pull-right"></div>');
        var jCol = $('<div class="col-xs-6"></div>');
        if (Array.isArray(jContent)) {
          for (var j in jContent) {
            jDiv.append(jContent[j]);
          }
        } else {
          jDiv.append(jContent);
        }
        jCol.append(jDiv);
        jSetting.append(jCol);
      }

      function getSwitchButton(id, checked) {
        var jLabel = $('<label class="switch pull-right"></label>');
        var jInput = $("<input id='setting_value_" + id + "' class='setting_input_value' type='checkbox' " + (checked ? 'checked' : '') + "/>");
        jInput.change(function() {saveSettings(settings);});
        jLabel.append(jInput);
        jLabel.append('<a class="slider round"></a>');
        return jLabel;
      }

      function genSettings(jContainer, settings) {
        for (var i in settings) {
          var jGroup = $("<div class='list-group'></div>");
          for (var g in settings[i]) {
            var id =  i + "_" + g;
            var setting = settings[i][g];
            var title = getTitle(setting);
            var jGroupItem = $("<div id='setting_" + id + "' class='list-group-item'></div>");
            var jSetting = $("<div class='row'></div>");
            if (typeof setting.default === "boolean") {
              appendTitle(jSetting, title);
              appendCol(jSetting, getSwitchButton(id, setting.default));
            } else if (typeof setting.default === "number") {
              var step = setting.step;
              var max = setting.max;
              var min = setting.min;
              var jBtns = [];
              var jInput = $("<input id='setting_value_" + id + "' class='setting_input_value' type='number' value='" + setting.default + "' readonly/>");
              var jBtnP = $('<button id="setting_value_p_' + id + '" class="btn btn-danger">+' + step + '</button>');
              var jBtnM = $('<button id="setting_value_m_' + id + '" class="btn btn-danger">-' + step + '</button>');
			  
              jBtnP.click((function(jInput, min, max, step){
                return function() {
                  var newValue = (+jInput.val()) + step;
                  //var newValue = (+jInput.val()) + step * Math.pow(10, pow10);
                  if (newValue < max) {
                    jInput.val(newValue);
                  }
                  else if (newValue >= max) {
                    jInput.val(max)
                  }
                  saveSettings(settings);
                }
              })(jInput, min, max, step));

              jBtnM.click((function(jInput, min, max, step){
                return function() {
                  var newValue = (+jInput.val()) - step;
                 // var newValue = (+jInput.val()) - step * Math.pow(10, pow10);
                  if (newValue > min) {
                    jInput.val(newValue);
                  }
                  else if (newValue <= min) {
                    jInput.val(min)
                  }
                  saveSettings(settings);
                }
              })(jInput, min, max, step));
			  
              jBtns.push(jInput);
              jBtns.push(jBtnP);
              jBtns.push(jBtnM);
              jInput.change(function() {saveSettings(settings);});
              appendTitle(jSetting, title);
              appendCol(jSetting, jBtns);
            } else if (typeof setting.default === "string") {
              var jInput = $("<input id='setting_value_" + id + "' class='setting_input_value' type='text' value='" + setting.default + "'/>");
              jInput.change(function() {saveSettings(settings);});
              appendTitle(jSetting, title);
              appendCol(jSetting, jInput);
            } else if (setting.buttons !== undefined) {
              var jBtns = [];
              for (var j = 0; j < setting.buttons.length; j++) {
                (function(btn) {
                  var jBtn = $('<button id="setting_value_b_' + id + '" class="btn btn-plus"></button>');
                  jBtn.text(btn.title);
                  // 綁定事件，避免直接把 onclick 字串插入到 HTML attribute（避免引號問題）
                  jBtn.on('click', function(e) {
                    try {
                      if (typeof btn.onclick === 'function') {
                        btn.onclick();
                      } else if (typeof btn.onclick === 'string') {
                        // 使用 eval 以維持原先字串行為（例如 saveLocale('en-US')）
                        // 因為這段會在受信任的 local UI 環境使用，暫時接受 eval
                        window.eval(btn.onclick);
                      }
                    } catch (err) {
                      console.log('button onclick error:', err);
                    }
                  });
                  jBtns.push(jBtn);
                })(setting.buttons[j]);
              }
              appendTitle(jSetting, title);
              appendCol(jSetting, jBtns);
            } else if (title !== undefined) {
              jSetting.append("<div class='col-xs-12'>" + title + "</div>");
            }
            jGroupItem.append(jSetting);
            jGroup.append(jGroupItem);
          }
          jContainer.append(jGroup)
        }
      }
    </script>
